[package]
name = "baruch-store"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
baruch-core = { path = "../baruch-core" }
baruch-typst = { path = "../baruch-typst" }
# Austauschformat zwischen Instanzen (Runde 26): Modell für exchange_dump/exchange_apply.
baruch-exchange = { path = "../baruch-exchange" }
sha2 = "0.10"
# Bilder (Migration 0009) liegen als Base64-Text in der Datenbank.
base64 = "0.22"
getrandom = "0.2"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
dirs = "6"

[dev-dependencies]
tempfile = "3"
