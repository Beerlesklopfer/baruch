[package]
name = "baruch-exchange"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Austauschformat zwischen Baruch-Instanzen (.baruch als ZIP, .baruch.xml), Runde 26"

# Nur Format und Prüfung, ohne Datenbank: Modell (`model`), Schreiben (`write`), Lesen und Prüfen (`read`).
# Neue Abhängigkeiten nur über den Integrator (Konflikte im Cargo.lock).
[dependencies]
quick-xml = "0.38"
# Nur STORED und DEFLATE (Vertrag R26 F1/F7); ohne Verschlüsselung, bzip2, zstd, lzma.
zip = { version = "2.4", default-features = false, features = ["deflate"] }
sha2 = "0.10"
base64 = "0.22"
thiserror = "2"
# Satz-Einstellungen (Runde 29, Unterversion 6): `<satz>` bildet `baruch_typst::typeset::TypesetSettings` ab (rein,
# ohne Datenbank).
baruch-typst = { path = "../baruch-typst" }

[dev-dependencies]
tempfile = "3"
