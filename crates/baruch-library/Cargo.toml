[package]
name = "baruch-library"
description = "Autorenbibliothek (Titel, Zitate) und Volltextsuche (FTS5) für Baruch"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
# Unicode-Normalform NFC (Runde 19, Vergleich von Wortlaut und Zitaten). Lizenz MIT OR Apache-2.0; liegt schon im Lock.
unicode-normalization = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tempfile = "3"
minijinja = { version = "3", features = ["serde", "urlencode"] }
serde_json = "1"
