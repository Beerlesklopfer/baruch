# Website of Baruch (https://baruch.bernau.family/). Building and preview: site/README.md.
# Deployment is done by the CI (GitHub Pages), never by hand.
baseURL = "https://baruch.bernau.family/"
# Contract R24 §1 names `languageCode = "de"`; hugo from 0.158 reports the key as deprecated (an abort with
# --panicOnWarning) and asks for `locale`. Same effect: <html lang="de">. Each language sets its own locale below.
locale = "de"
title = "Baruch"
theme = "baruch"
# Multilingual (user decision 2026-11-27: interface and help in German and English, Round 39b): content per language
# under content/<language>/ (mounted in [module] at the end). German stays the default without a subfolder in the address, so the German addresses
# do not change; English (content/en/) lives under /en/ with the same relative paths (Hugo pairs translations by
# path).
defaultContentLanguage = "de"
defaultContentLanguageInSubdir = false
# No tags, categories or feeds: the site consists of seven fixed pages and the section Hilfe (help, one start page
# and one page per topic), in each language; English also has the section docs (developer documentation,
# generated, Round 39c).
disableKinds = ["taxonomy", "term", "rss"]
enableRobotsTXT = false
enableGitInfo = false

# Read by scripts/ci-site.sh and crates/baruch-server/tests/round24_abnahme.rs: keep these four keys here, at the top
# level, as `key = "value"` lines.
[params]
# Version of the linked packages. The only source of the version is Cargo.toml ([workspace.package] version);
# whoever changes it there updates this value (only the user sets the version).
version = "0.9.1"
repo = "https://github.com/Beerlesklopfer/baruch"
# Fingerprint of the APT archive key. Empty = the site shows the placeholder notice.
# Entered only by the user (never fetched from the net, never guessed).
aptFingerprint = "BEBD FEF8 F980 2EC5 8A90  B818 9A9C 9199 6BB8 8DB4"
description = "Freie Schreibwerkstatt für Bücher und Predigten: Fassungen, Buchsatz mit Typst und Assistenten, die nur vorschlagen. AGPL-3.0, läuft auf dem eigenen Rechner."

[languages]
  [languages.de]
    locale = "de"
    weight = 1
    label = "Deutsch"

    [[languages.de.menus.main]]
      name = "Funktionen"
      pageRef = "/funktionen"
      weight = 10
    [[languages.de.menus.main]]
      name = "Installation"
      pageRef = "/installation"
      weight = 20
    [[languages.de.menus.main]]
      name = "Hilfe"
      pageRef = "/hilfe"
      weight = 30
    [[languages.de.menus.main]]
      name = "Betrieb"
      pageRef = "/betrieb"
      weight = 40
    [[languages.de.menus.main]]
      name = "MCP und Assistenten"
      pageRef = "/mcp"
      weight = 50
    # The developer documentation exists only in English (generated from docs/, Round 39c); the German menu points
    # to the English section by address, so there is no German page and no German twin.
    [[languages.de.menus.main]]
      name = "Dokumentation (englisch)"
      url = "/en/docs/"
      weight = 60
    [[languages.de.menus.footer]]
      name = "Lizenz"
      pageRef = "/lizenz"
      weight = 10
    [[languages.de.menus.footer]]
      name = "Impressum"
      pageRef = "/impressum"
      weight = 20

  [languages.en]
    locale = "en"
    weight = 2
    label = "English"

    [languages.en.params]
      description = "Free writing workshop for books and sermons: revisions, book typesetting with Typst and assistants that only suggest. AGPL-3.0, runs on your own computer."

    [[languages.en.menus.main]]
      name = "Features"
      pageRef = "/funktionen"
      weight = 10
    [[languages.en.menus.main]]
      name = "Installation"
      pageRef = "/installation"
      weight = 20
    [[languages.en.menus.main]]
      name = "Help"
      pageRef = "/hilfe"
      weight = 30
    [[languages.en.menus.main]]
      name = "Operation"
      pageRef = "/betrieb"
      weight = 40
    [[languages.en.menus.main]]
      name = "MCP and assistants"
      pageRef = "/mcp"
      weight = 50
    [[languages.en.menus.main]]
      name = "Documentation"
      pageRef = "/docs"
      weight = 60
    [[languages.en.menus.footer]]
      name = "Licence"
      pageRef = "/lizenz"
      weight = 10
    [[languages.en.menus.footer]]
      name = "Legal notice"
      pageRef = "/impressum"
      weight = 20

[markup]
  [markup.highlight]
    # No syntax highlighter: code blocks stay plain <pre><code>.
    codeFences = false
  [markup.tableOfContents]
    # Table of contents of the help pages (and of the pages with `inhalt: true`): headings of levels 2 and 3.
    startLevel = 2
    endLevel = 3
    ordered = false
  [markup.goldmark.renderer]
    unsafe = false

# Content per language and the generated developer documentation (Round 39c). Hugo turns `contentDir` into mounts,
# but as soon as one content mount is configured the defaults are gone, so all three are named here: content/de for
# German, content/en for English, and generated/ (written by site/tools/docs_pages.py from docs/*.md, gitignored)
# for English only, which gives /en/docs/. scripts/ci-site.sh runs the generator before Hugo; a plain `hugo` without
# it builds the site without the section (ci-site.sh then stops: public/en/docs/index.html is missing).
[module]
  [[module.mounts]]
    source = "content/de"
    target = "content"
    [module.mounts.sites.matrix]
      languages = ["de"]
  [[module.mounts]]
    source = "content/en"
    target = "content"
    [module.mounts.sites.matrix]
      languages = ["en"]
  [[module.mounts]]
    source = "generated"
    target = "content"
    [module.mounts.sites.matrix]
      languages = ["en"]
