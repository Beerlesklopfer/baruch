# Bildliste der Hilfe (Runde 37, Vertrag §6). Einzige Quelle der Bildnamen: Der Shortcode `hilfebild`
# (site/themes/baruch/layouts/_shortcodes/hilfebild.html) bricht den Bau ab, wenn ein Name hier nicht steht.
#
# Dateien: site/static/bilder/hilfe/<name>.png, die dunkle Fassung daneben als <name>-dunkel.png.
# Files since Round 39b: German pictures stay where they were; English pictures lie in site/static/bilder/en/hilfe/
# (shortcode and partial bildpfad.html choose the folder by the language of the page). A missing light picture
# stops the build in every language; the dark variant stays optional.
#
# Felder je [[bild]]:
#   name    fester Name (Kleinbuchstaben, ASCII, Bindestriche). Niemand benennt um oder streicht; neue Namen trägt
#           nur der Integrator nach.
#   seite   Seiten, auf denen das Bild steht (Liste): Dateiname unter site/content/de/hilfe/ ohne „.md“ oder eine der
#           übrigen Seiten (installation, mcp, betrieb). Ein Name darf auf mehreren Seiten stehen.
#   zeigt   was zu sehen ist; die Adresse in Klammern ist ein Hinweis aus der Routenliste (WERK = Nummer des
#           Beispielwerks, KEY = Schlüssel eines Abschnitts, ID = Nummer). Endgültige Adresse, Fenstergröße,
#           Ausschnitt und Schritte legt das Werkzeug site/tools/bildschirmfotos.py fest (eigene Felder ergänzen).
#   dunkel  true = zusätzlich die dunkle Fassung <name>-dunkel.png aufnehmen.
#   braucht Voraussetzungen der Aufnahme:
#             "klick"   Zustand entsteht erst durch Aufklappen oder Klick
#             "ohne-js" Profil ohne JavaScript
#             "konten"  erst nach allen anderen Bildern bzw. auf einem zweiten Wegwerf-Server, weil danach alles
#                       eine Anmeldung verlangt
#             "sword"   nur mit --sword ORDNER (Ordner mit Bibelmodulen); sonst übersprungen und genannt
#
# Felder des Werkzeugs site/tools/bildschirmfotos.py (Aufgabe bilder; ausführlich in site/tools/README.md):
#   adresse    Pfad am Wegwerf-Server, beginnt mit „/“. Platzhalter in geschweiften Klammern setzt das Werkzeug
#              ein: {work} Beispielwerk, {sample} mitgeliefertes Beispielwerk, {key} Abschnitt „Der erste Morgen“
#              (zwei Fassungen, Beiträge), {key_logbook} „Das Logbuch“ (Zitat, Bild, Registermarken),
#              {key_proposal} „Besuch vom Festland“ (Vorschlag eines Assistenten, Fassung {rev_proposal}),
#              {key_xref} „Was das Licht nicht zeigt“ (Bibelstelle, Querverweis, Fassung {rev_xref}),
#              {key_night} „Die Nacht ohne Lampe“ (Befund, Vorschlag des Lektors), {key_farewell} „Abschied“,
#              {idea} Einfall am Abschnitt, {branch} Hauptthema mit Unterknoten, {request} Gliederungsantrag,
#              {thread} Faden, {post} Beitrag eines Assistenten, {title} Quelle in der Bibliothek.
#              Adressen unter /_antwort/<name> liefert der Vermittler aus: die gespeicherte Antwort eines Formulars
#              (Bericht bzw. Vorschau nach dem Einlesen einer Datei).
#   fenster    Fenstergröße „BREITExHÖHE“; fehlt = 1400x860. Bei 1400 px steht der Laptop-Modus auf „Aus“ (volles
#              Menüband), solange kein Schritt das Cookie baruch_laptop ändert.
#   thema      "hell" (Vorgabe) oder "dunkel" für die Hauptaufnahme; dunkel = true ergibt zusätzlich die dunkle.
#   ausschnitt "BxH+X+Y" (fester Ausschnitt) oder "css:SELEKTOR" (das Element wird im Browser gemessen; braucht
#              JavaScript). Fehlt = ganzes Fenster.
#   schritt    Liste, in dieser Reihenfolge: "cookie:NAME=WERT" (leer = Cookie weglassen), "offen:TEXT" (jedes
#              <details>, dessen öffnendes Tag TEXT enthält, bekommt open – geht ohne JavaScript),
#              "klick:SELEKTOR" (Klick nach dem Laden; braucht JavaScript), "sitzung:autorin" bzw.
#              "sitzung:lektor" (angemeldet; nur mit stufe = "konten").
#   erwartet   Texte, die --pruefen in der Antwort verlangt (roh oder HTML-maskiert) – der Beleg, dass der Aufbau
#              des Beispielwerks das Motiv wirklich hergibt.
#   stufe      "offen" (Vorgabe: aufgenommen, bevor es Konten gibt) oder "konten" (danach; jede Seite verlangt eine
#              Anmeldung). „Konten einrichten“ gibt es nur in der Stufe „offen“, Befunde erst in der Stufe „konten“
#              (finding.add ist den Lektoren vorbehalten).
#
# Fields for two languages (Round 39b, contract §2.5; additive only, every field above keeps name and meaning):
#   sprachen      languages the picture is taken for, list of "de" and "en"; missing = both. The help pages of a
#                 language use only pictures of that language.
#   adresse_en    address for the English pictures (same placeholders as adresse); missing = adresse. Needed where
#                 the address carries words of the sample work (search word, marked word).
#   ausschnitt_en crop for the English pictures (same forms as ausschnitt); missing = ausschnitt.
#   schritt_en    steps for the English pictures (same kinds as schritt, the whole list); missing = schritt.
# For --lang en the tool fills the work with English invented data (site/tools/beispielwerk.en.typ) and translates
# the texts of `erwartet` through its own table (EXPECTED_EN in site/tools/bildschirmfotos.py): a German text without
# an English counterpart there is an error of --liste/--pruefen with --lang en.
#
# Regeln für Text und Bilder (Vertrag §4):
# - Keine echten Namen, Werke oder Daten. Das Beispielwerk ist „Ein Jahr auf Mövenoog“ von Mara Tiedemann
#   (erfunden); nichts aus fremden Werken oder Ordnern des Nutzers.
# - Aufnahmen nur von einem eigenen Wegwerf-Server (--listen 127.0.0.1:0, --data <Temp-Ordner>); nie vom Dienst
#   des Nutzers. Keine Anfrage an Assistenten-Dienste, MultiGPT, die Websuche oder das Netz; Adressen in den
#   Einstellungen zeigen auf 127.0.0.1:9. Kein Token ist lesbar.
# - Alltagssprache in alt-Text und Bildunterschrift (Fassung statt Revision, Assistent statt Persona, …), keine
#   Rundennummern, keine Dateinamen des Quelltexts, keine Routen.
# - Jeder Aufruf des Shortcodes braucht einen alt-Text. Kein rohes HTML in Markdown, kein JavaScript, keine fremden
#   Adressen für Stil, Schrift oder Bild.
# - Ungeprüftes (macOS, Windows, echte Bibelmodule) bleibt als „nicht geprüft“ gekennzeichnet.
# - Alle Bilder zusammen (site/static/bilder) bleiben unter 20 MB.
#   Since Round 39b the limit holds per language: German = site/static/bilder without en/, English = bilder/en/.

