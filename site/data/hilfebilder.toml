# Bildliste der Hilfe (Runde 37, Vertrag §6). Einzige Quelle der Bildnamen: Der Shortcode `hilfebild`
# (site/themes/baruch/layouts/_shortcodes/hilfebild.html) bricht den Bau ab, wenn ein Name hier nicht steht.
#
# Dateien: site/static/bilder/hilfe/<name>.png, die dunkle Fassung daneben als <name>-dunkel.png.
# Fehlt <name>.png, gibt der Shortcode nichts aus – die Seite baut auch ohne die Fotos.
#
# Felder je [[bild]]:
#   name    fester Name (Kleinbuchstaben, ASCII, Bindestriche). Niemand benennt um oder streicht; neue Namen trägt
#           nur der Integrator nach.
#   seite   Seiten, auf denen das Bild steht (Liste): Dateiname unter site/content/hilfe/ ohne „.md“ oder eine der
#           übrigen Seiten (installation, mcp, betrieb). Ein Name darf auf mehreren Seiten stehen.
#   zeigt   was zu sehen ist; die Adresse in Klammern ist ein Hinweis aus der Routenliste (WERK = Nummer des
#           Beispielwerks, KEY = Schlüssel eines Abschnitts, ID = Nummer). Endgültige Adresse, Fenstergröße,
#           Ausschnitt und Schritte legt das Werkzeug site/tools/bildschirmfotos.py fest (eigene Felder ergänzen).
#   dunkel  true = zusätzlich die dunkle Fassung <name>-dunkel.png aufnehmen.
#   braucht Voraussetzungen der Aufnahme:
#             "klick"   Zustand entsteht erst durch Aufklappen oder Klick
#             "ohne-js" Profil ohne JavaScript
#             "konten"  erst nach allen anderen Bildern bzw. auf einem zweiten Wegwerf-Server, weil danach alles
#                       eine Anmeldung verlangt
#             "sword"   nur mit --sword ORDNER (Ordner mit Bibelmodulen); sonst übersprungen und genannt
#
# Regeln für Text und Bilder (Vertrag §4):
# - Keine echten Namen, Werke oder Daten. Das Beispielwerk ist „Ein Jahr auf Mövenoog“ von Mara Tiedemann
#   (erfunden); nichts aus fremden Werken oder Ordnern des Nutzers.
# - Aufnahmen nur von einem eigenen Wegwerf-Server (--listen 127.0.0.1:0, --data <Temp-Ordner>); nie vom Dienst
#   des Nutzers. Keine Anfrage an Assistenten-Dienste, MultiGPT, die Websuche oder das Netz; Adressen in den
#   Einstellungen zeigen auf 127.0.0.1:9. Kein Token ist lesbar.
# - Alltagssprache in alt-Text und Bildunterschrift (Fassung statt Revision, Assistent statt Persona, …), keine
#   Rundennummern, keine Dateinamen des Quelltexts, keine Routen.
# - Jeder Aufruf des Shortcodes braucht einen alt-Text. Kein rohes HTML in Markdown, kein JavaScript, keine fremden
#   Adressen für Stil, Schrift oder Bild.
# - Ungeprüftes (macOS, Windows, echte Bibelmodule) bleibt als „nicht geprüft“ gekennzeichnet.
# - Alle Bilder zusammen (site/static/bilder) bleiben unter 20 MB.

