{{- /* Kopfzeile: Name, Hauptmenü (hugo.toml, menus.main), Quellcode-Link. */ -}}
{{- $seite := . -}}
<header class="kopf">
  <div class="rand kopf-zeile">
    <a class="marke" href="{{ "/" | relURL }}"{{ if .IsHome }} aria-current="page"{{ end }}>
      <span class="marke-zeichen" aria-hidden="true">B</span>
      <span class="marke-name">{{ site.Title }}</span>
    </a>
    <nav class="menue" aria-label="Hauptmenü">
      <ul>
        {{- range site.Menus.main }}
        <li><a href="{{ .URL }}"{{ if $seite.IsMenuCurrent .Menu . }} aria-current="page"{{ end }}>{{ .Name }}</a></li>
        {{- end }}
        <li><a class="aussen" href="{{ site.Params.repo }}" rel="noopener">Quellcode</a></li>
      </ul>
    </nav>
  </div>
</header>
