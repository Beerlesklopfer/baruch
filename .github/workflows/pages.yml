# SPDX-License-Identifier: AGPL-3.0-or-later
# Webseite: baut die Hugo-Seite (site/) und liefert sie über GitHub Pages aus – bei Push auf main, beim
# Veröffentlichen eines Release und von Hand. Ablauf und einmalige Einrichtung: docs/Verteilung.md.
#
# - Auslöser `release: published` (Runde 36): Am 2026-11-24 kam die Auslieferung eines Release, dessen Tag auf dem
#   Commit des letzten main-Laufs lag, nicht an. Sobald der Nutzer das Release veröffentlicht, läuft darum dieser
#   Ablauf noch einmal – unabhängig vom Release-Lauf und mit /apt/ aus dem eben veröffentlichten Release. Gebaut
#   wird dabei der Stand von main (nicht der des Tags), damit ein spät veröffentlichtes Release die Seite nicht
#   auf einen älteren Stand zurücksetzt. Grenze: Ein Release, das der Arbeitsablauf selbst sofort veröffentlicht
#   (RELEASE_DRAFT=false), löst nichts aus – Ereignisse des GITHUB_TOKEN starten keine Abläufe; dann von Hand
#   (`gh workflow run pages.yml`). Nie ausgeführt geprüft (docs/Verteilung.md, "State of verification").
# - Ein Seiten-Push darf das APT-Repository nicht löschen: Pages ersetzt immer die ganze Seite. Darum holt der
#   Ablauf apt-repo.tar.gz des letzten veröffentlichten Release und legt es wieder nach /apt/.
# - Gibt es noch kein veröffentlichtes Release mit dem Archiv, erscheint die Seite ohne /apt/ (Warnung). Jeder
#   andere Fehler beim Abruf bricht ab – lieber keine neue Seite als eine ohne Repository.
# - Grenze: Entwürfe sieht ein Token mit `contents: read` nicht. Liegt das jüngste Release noch als Entwurf vor,
#   liefert dieser Ablauf das Repository des vorigen veröffentlichten Release aus (docs/Verteilung.md).
# - Aktionen sind auf Commit-SHAs festgelegt (am 2026-11-24 mit `git ls-remote` gegen die Tags geprüft); Hugo
#   lädt scripts/ci-tool.sh in fester Version mit Prüfsumme. Kein Geheimnis außer dem GITHUB_TOKEN des Laufs.
name: Webseite

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

# Dieselbe Gruppe wie die Jobs „pages-build“ und „pages-deploy“ in release.yml: nie zwei Jobs der Gruppe zugleich,
# kein laufender wird abgebrochen. Hier hält der ganze Lauf die Gruppe, in release.yml jeder der beiden Jobs für
# sich. Ein Push auf main während eines Release kann darum dessen Auslieferung überholen oder verdrängen:
# main erst nach Ende des Release-Laufs schieben (docs/Verteilung.md, "Delivery through GitHub Pages").
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Bauen und Ausliefern sind zwei Jobs (Runde 32), wie GitHub es für Pages vorsieht: Am 2026-11-24 fand
  # deploy-pages im selben Job das eben hochgeladene Artefakt zweimal nicht, und das Wiederholen des Jobs legte
  # ein zweites Artefakt an. Nebenbei hat der Job, der Hugo und die Skripte ausführt, so keine Schreibrechte.
  pages-build:
    name: Webseite und /apt/ bauen
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      # Beim Ereignis `release` zeigt der Lauf auf den Commit des Tags; gebaut wird trotzdem main (Kopf der Datei).
      # Bei Push und von Hand bleibt `ref` leer – dann gilt der Commit des Laufs wie bisher.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'release' && 'main' || '' }}

      - name: Hugo (feste Version, Prüfsumme)
        run: sh scripts/ci-tool.sh hugo "$RUNNER_TEMP/werkzeug"

      - name: APT-Repository des letzten veröffentlichten Release holen
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -eu
          rc=0
          sh scripts/ci-apt-fetch.sh apt-base || rc=$?
          case "$rc" in
            0) ;;
            3) echo "::warning::Kein veröffentlichtes Release mit apt-repo.tar.gz – die Seite erscheint ohne /apt/." ;;
            *) exit "$rc" ;;
          esac

      # Versionsabgleich, `hugo --minify --panicOnWarning -s site`, Repository nach site/public/apt/.
      - name: Seite bauen, APT-Repository nach /apt/
        run: |
          set -eu
          if [ -f apt-base/apt-repo.tar.gz ]; then
            HUGO="$RUNNER_TEMP/werkzeug/hugo" sh scripts/ci-site.sh --apt apt-base/apt-repo.tar.gz
          else
            HUGO="$RUNNER_TEMP/werkzeug/hugo" sh scripts/ci-site.sh
          fi

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/public

  pages-deploy:
    name: Webseite und /apt/ ausliefern (GitHub Pages)
    needs: [pages-build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
