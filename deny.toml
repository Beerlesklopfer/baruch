# cargo-deny (https://embarkstudios.github.io/cargo-deny/): Lizenzen, Quellen, Sicherheitsmeldungen.
# Lauf: `cargo deny check` (CI, .github/workflows/ci.yml); lokal ohne Netz: `cargo deny check licenses sources bans`
# (`advisories` braucht die RustSec-Datenbank aus dem Netz und läuft darum nur in der CI).
# Baruch steht unter der AGPL-3.0-or-later; erlaubt sind nur Lizenzen, die sich damit vertragen.
# Ein Verstoß wird behoben oder dem Nutzer vorgelegt – nicht durch Lockern dieser Datei versteckt.

[graph]
# Die Plattformen, für die Pakete entstehen (docs/Verteilung.md).
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
]
all-features = false

[advisories]
# RustSec-Datenbank (braucht Netz, darum nur in der CI). Ausnahmen nur mit Begründung und Verweis.
# Ausnahmen vom 2026-11-24 (vor dem erneuten Tag v0.9.0), offen nach 0.9.0 – siehe docs/Backlog.md
# („Nach 0.9.0 offen: Ausnahmen in deny.toml“). Gehoben wurden zugleich: quick-xml 0.38 → 0.42 (eigene Nutzung),
# zip 2.4 → 9.8, url 2.5.8 → 2.5.9.
# Runde 36 (2026-11-27): Die Ausnahme für libsqlite3-sys 0.30 (gebündeltes SQLite unter sqlx 0.8) ist entfallen –
# sqlx 0.9 erlaubt libsqlite3-sys bis 0.40, das Lock führt 0.40 (Wächter: baruch-server/tests/round36_sqlx.rs).
ignore = [
    # quick-xml 0.38.4 bleibt nur über typst-library → hayagriva 0.10.1 → citationberg 0.7.0 (neueste Fassung,
    # verlangt quick-xml ^0.38). Baruchs eigene Nutzung (baruch-epub, baruch-exchange, baruch-server) ist auf 0.42
    # gehoben. Rest: Rechenzeit bzw. Speicher beim Lesen eines CSL-Stils, den der Autor selbst in seiner
    # Werkvorlage nennt (`#bibliography(style: …)`); die mitgelieferten Stile von typst sind fest.
    { id = "RUSTSEC-2026-0194", reason = "quick-xml 0.38 nur über citationberg 0.7 (kein Fix verfügbar); eigene Nutzung auf 0.42; nur CSL-Stile aus der eigenen Werkvorlage" },
    { id = "RUSTSEC-2026-0195", reason = "quick-xml 0.38 nur über citationberg 0.7 (kein Fix verfügbar); eigene Nutzung auf 0.42; nur CSL-Stile aus der eigenen Werkvorlage" },
    # chrono gilt als unbetreut (kein Fix, keine neuere Fassung). Es kommt über arrow/datafusion/lance/lancedb, eine
    # Ablösung gibt es dort nicht; die direkte Nutzung in baruch-server allein abzulösen nähme es nicht aus dem Baum.
    { id = "RUSTSEC-2026-0543", reason = "chrono (unmaintained, kein Upgrade) kommt über arrow/datafusion/lance/lancedb; Ablösung offen nach 0.9.0" },
]

[licenses]
confidence-threshold = 0.93
allow = [
    # Baruch selbst
    "AGPL-3.0-or-later",
    # freizügig
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "ISC",
    "Zlib",
    "BSL-1.0",
    "bzip2-1.0.6",
    "Unicode-3.0",
    # Gemeinfreiheit bzw. Verzicht
    "CC0-1.0",
    "Unlicense",
    # schwaches Copyleft je Datei, mit der AGPL vereinbar (MPL-2.0 §3.3, „Secondary License“)
    "MPL-2.0",
    # Datenlizenz (Wurzelzertifikate in webpki-roots)
    "CDLA-Permissive-2.0",
]

[licenses.private]
ignore = false

[bans]
multiple-versions = "allow"
# Platzhalter-Versionen („*“) sind verboten. Die Pfad-Abhängigkeiten im Workspace tragen keine Versionsangabe;
# sie sind erlaubt, weil alle Crates `publish = false` tragen (seit Runde 24) – nur dann lässt
# `allow-wildcard-paths` sie durch.
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# Das Lock enthält keine git-Quellen (sword-modules liegt als Pfad unter vendor/).
allow-git = []
